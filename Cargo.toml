[package]
name = "noaa-weather-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rainfall, radar, alerts, forecasts and current conditions from NOAA and NWS raw data, at the terminal. No API keys. Unofficial."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/noaa-weather-cli"
readme = "README.md"
keywords = ["weather", "noaa", "rainfall", "radar", "mrms"]
categories = ["command-line-utilities"]

[lib]
name = "noaa_weather"
path = "src/lib.rs"

[[bin]]
name = "wx"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The binary's family surface. A program using the library (a map server, say)
# turns this off and skips clap_complete and the pk-cli-* crates.
cli = [
  "dep:clap",
  "dep:clap_complete",
  "dep:pk-cli-core",
  "dep:pk-cli-auth",
  "dep:pk-cli-selfupdate",
  "dep:tracing-subscriber",
]

[dependencies]
anyhow = "1"
bytes = "1"
flate2 = "1"
futures = "0.3"
jiff = { version = "0.2", features = ["tzdb-bundle-always", "serde"] }
parquet = { version = "60", default-features = false, features = ["snap"] }
png = "0.17"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.20.0", optional = true }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.20.0", features = ["reqwest"], optional = true }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.20.0", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
